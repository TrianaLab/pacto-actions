name: 'Pacto CLI'
description: 'Plan and publish Pacto contracts with pacto ci, check impact, validate, diff and document them in your GitHub Actions workflows'
author: 'TrianaLab'

branding:
  icon: 'feather'
  color: 'blue'

inputs:
  command:
    description: 'Command to run: "setup", "ci", "publish", "impact", "validate", "diff", or "doc"'
    required: true
  # setup inputs
  version:
    description: '[setup] Pacto version to install (e.g., 4.5.0). Empty installs the version this release pins and checks by sha256; "latest" installs the newest release unpinned'
    required: false
    default: ''
  github-token:
    description: 'GitHub token passed as GH_TOKEN to all commands'
    required: false
    default: ${{ github.token }}
  # cache inputs
  cache:
    description: 'Enable OCI bundle caching across workflow runs (uses ~/.cache/pacto/oci/)'
    required: false
    default: 'true'
  # ci and publish inputs
  registry:
    description: '[ci/publish] Registry the services publish to (e.g., ghcr.io/acme). Empty lets pacto ci resolve it from the CI platform'
    required: false
  fail-on:
    description: '[ci] Which plan fails the step: "blocked" (exit 1) or "unverified" (exit 1 or 2)'
    required: false
    default: 'blocked'
  # diff and impact inputs
  old:
    description: '[diff/impact] Baseline contract: directory path or oci:// reference'
    required: false
  new:
    description: '[diff/impact] Updated contract: directory path or oci:// reference'
    required: false
  output-format:
    description: '[diff/impact] Output format: "text", "json", or "markdown"'
    required: false
    default: 'text'
  fail-on-breaking:
    description: '[diff] Fail the action if breaking changes are detected'
    required: false
    default: 'true'
  path:
    description: '[ci/publish/validate/doc] Root that pacto ci walks, or the contract directory or oci:// reference'
    required: false
    default: '.'
  # override inputs
  values:
    description: '[validate/diff/doc] Values file(s) to merge into the contract (newline-separated, last wins)'
    required: false
  set:
    description: '[validate/diff/doc] Set contract values inline (newline-separated, e.g. service.version=2.0.0)'
    required: false
  # diff-specific override inputs
  old-values:
    description: '[diff] Values file(s) to merge into the old contract (newline-separated)'
    required: false
  old-set:
    description: '[diff] Set values on the old contract (newline-separated)'
    required: false
  new-values:
    description: '[diff] Values file(s) to merge into the new contract (newline-separated)'
    required: false
  new-set:
    description: '[diff] Set values on the new contract (newline-separated, e.g. service.version=2.0.0)'
    required: false
  # doc inputs
  output-path:
    description: '[doc] File path to save the generated markdown documentation'
    required: false
  comment-on-pr:
    description: '[diff/doc] Post the output as a PR comment'
    required: false
    default: 'false'
  add-to-summary:
    description: '[doc] Add the documentation to the GitHub Step Summary'
    required: false
    default: 'true'

outputs:
  version:
    description: '[setup] The exact version of Pacto that was installed'
    value: ${{ steps.setup.outputs.version }}
  gate:
    description: '[ci] Gate of the plan: "clear", "blocked", or "unverified"'
    value: ${{ steps.ci.outputs.gate }}
  exit-code:
    description: '[ci] Exit code of pacto ci: 0 clear, 1 blocked, 2 unverified'
    value: ${{ steps.ci.outputs.exit-code }}
  impact-output:
    description: '[impact] The full impact output'
    value: ${{ steps.impact.outputs.impact-output }}
  has-breaking-changes:
    description: '[diff] Whether breaking changes were detected ("true" or "false")'
    value: ${{ steps.diff.outputs.has-breaking-changes }}
  diff-output:
    description: '[diff] The full diff output'
    value: ${{ steps.diff.outputs.diff-output }}
  doc-output:
    description: '[doc] The generated markdown documentation'
    value: ${{ steps.doc.outputs.doc-output }}

runs:
  using: 'composite'
  steps:
    - name: Validate command
      shell: bash
      env:
        COMMAND: ${{ inputs.command }}
      run: |
        case "${COMMAND}" in
          setup|ci|publish|impact|validate|diff|doc) ;;
          *)
            echo "::error::Invalid command '${COMMAND}'. Must be one of: setup, ci, publish, impact, validate, diff, doc"
            exit 1
            ;;
        esac

        # Disable pacto's update-check footer for the rest of the job. In CI it
        # fires an anonymous api.github.com call on every command (rate-limits on
        # shared runners) and prints "A new version of pacto is available…" to
        # stderr, which leaks into captured output (diff/doc PR comments) and
        # breaks the setup version capture below.
        echo "PACTO_NO_UPDATE_CHECK=1" >> "${GITHUB_ENV}"

    # ── Setup ──────────────────────────────────────────────
    # Installs the Pacto release this release of pacto-actions pins, checked
    # against the sha256 below (the same values as .github/workflows/ci.yml).
    # Any other version, and any OS but linux, is checked against the
    # checksums.txt of its own release. A missing checksum fails the step.
    - name: Install Pacto
      if: inputs.command == 'setup'
      id: setup
      shell: bash
      env:
        IN_VERSION: ${{ inputs.version }}
        PACTO_VERSION: 4.5.0
        PACTO_SHA256_AMD64: 4972e3235ebd9f0228567d46f5360d50737cc1b8aa3eb4f3468367e2d95fce83
        PACTO_SHA256_ARM64: 0eec7c3c8b020bb099331734cbd4f5b33a559738bae4d4a36acad15714a53562
      run: |
        set -euo pipefail
        os=$(uname | tr '[:upper:]' '[:lower:]')
        case "$(uname -m)" in
          x86_64|amd64) arch=amd64; sum=$PACTO_SHA256_AMD64 ;;
          aarch64|arm64) arch=arm64; sum=$PACTO_SHA256_ARM64 ;;
          *) echo "::error::pacto has no build for $(uname -m)"; exit 1 ;;
        esac
        releases=https://github.com/TrianaLab/pacto/releases
        version=${IN_VERSION:-$PACTO_VERSION}
        if [ "$version" = latest ]; then url=$releases/latest/download; else url=$releases/download/v${version#v}; fi
        dir=$RUNNER_TEMP/pacto-bin
        mkdir -p "$dir"
        cd "$dir"
        if [ -n "$IN_VERSION" ] || [ "$os" != linux ]; then
          curl -fsSL -o checksums.txt "$url/checksums.txt"
          sum=$(grep "  pacto_${os}_${arch}\$" checksums.txt | cut -d' ' -f1 || true)
          if [ -z "$sum" ]; then echo "::error::pacto $version lists no checksum for pacto_${os}_${arch}"; exit 1; fi
        fi
        curl -fsSL -o pacto "$url/pacto_${os}_${arch}"
        if command -v sha256sum >/dev/null; then
          echo "$sum  pacto" | sha256sum -c -
        else
          echo "$sum  pacto" | shasum -a 256 -c -
        fi
        chmod +x pacto
        echo "$dir" >> "$GITHUB_PATH"

        # Capture installed version: the first semver match only, since a
        # multiline value breaks GITHUB_OUTPUT.
        INSTALLED_VERSION=$(./pacto version 2>&1 | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -n1 || true)
        [ -n "${INSTALLED_VERSION}" ] || INSTALLED_VERSION="${version}"
        echo "version=${INSTALLED_VERSION}" >> "${GITHUB_OUTPUT}"
        echo "Pacto ${INSTALLED_VERSION} installed"

    # ── Cache ──────────────────────────────────────────────
    - name: Restore OCI bundle cache
      if: inputs.command != 'setup' && inputs.cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/pacto/oci/
        key: pacto-oci-${{ runner.os }}-${{ github.run_id }}
        restore-keys: |
          pacto-oci-${{ runner.os }}-

    # ── CI ─────────────────────────────────────────────────
    # pacto ci plans every service under path. The step keeps pacto ci's exit
    # code (0 clear, 1 blocked, 2 unverified) as an output and fails per
    # fail-on in a separate step, so the outputs are set whatever the plan.
    - name: Run pacto ci
      if: inputs.command == 'ci'
      id: ci
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        IN_PATH: ${{ inputs.path }}
        IN_REGISTRY: ${{ inputs.registry }}
        PACTO_NO_CACHE: ${{ inputs.cache == 'true' && '0' || '1' }}
      run: |
        plan=$RUNNER_TEMP/pacto-plan.json
        set +e
        pacto ci "$IN_PATH" ${IN_REGISTRY:+--registry "$IN_REGISTRY"} --output-format json > "$plan"
        code=$?
        set -e
        gate=$(jq -r '.gate // empty' "$plan" 2>/dev/null || true)
        echo "gate=$gate" >> "$GITHUB_OUTPUT"
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"

    - name: Gate on the plan
      if: inputs.command == 'ci'
      shell: bash
      env:
        CODE: ${{ steps.ci.outputs.exit-code }}
        FAIL_ON: ${{ inputs.fail-on }}
      run: |
        case "$FAIL_ON" in
          blocked|unverified) ;;
          *) echo "::error::fail-on is blocked or unverified, got $FAIL_ON"; exit 1 ;;
        esac
        case "$CODE" in
          0) ;;
          2)
            if [ "$FAIL_ON" = unverified ]; then
              echo "::error::pacto ci could not verify every service (exit 2)"
              exit 1
            fi
            echo "::warning::pacto ci could not verify every service (exit 2); the job summary names them"
            ;;
          *) echo "::error::pacto ci exited $CODE"; exit 1 ;;
        esac

    # ── Publish ────────────────────────────────────────────
    # pacto ci --publish publishes every changed service on the merged commit.
    # Keyless signing needs id-token: write on the job that runs this step.
    - name: Run pacto ci --publish
      if: inputs.command == 'publish'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        IN_PATH: ${{ inputs.path }}
        IN_REGISTRY: ${{ inputs.registry }}
        PACTO_NO_CACHE: ${{ inputs.cache == 'true' && '0' || '1' }}
      run: pacto ci --publish "$IN_PATH" ${IN_REGISTRY:+--registry "$IN_REGISTRY"}

    # ── Impact ─────────────────────────────────────────────
    - name: Run pacto impact
      if: inputs.command == 'impact'
      id: impact
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        IN_OLD: ${{ inputs.old }}
        IN_NEW: ${{ inputs.new }}
        IN_FORMAT: ${{ inputs.output-format }}
        PACTO_NO_CACHE: ${{ inputs.cache == 'true' && '0' || '1' }}
      run: |
        if [ -z "$IN_OLD" ] || [ -z "$IN_NEW" ]; then
          echo "::error::Both 'old' and 'new' inputs are required for the impact command"
          exit 1
        fi
        set +e
        OUTPUT=$(pacto impact "$IN_OLD" "$IN_NEW" --output-format "$IN_FORMAT")
        code=$?
        set -e
        {
          echo "impact-output<<PACTO_IMPACT_EOF"
          echo "$OUTPUT"
          echo "PACTO_IMPACT_EOF"
        } >> "$GITHUB_OUTPUT"
        echo "$OUTPUT"
        exit "$code"

    # ── Validate ───────────────────────────────────────────
    - name: Validate contract
      if: inputs.command == 'validate'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        CONTRACT_PATH: ${{ inputs.path }}
        PACTO_NO_CACHE: ${{ inputs.cache == 'true' && '0' || '1' }}
        VALUES: ${{ inputs.values }}
        SET: ${{ inputs.set }}
      run: |
        set -euo pipefail
        ARGS=()
        if [ -n "${VALUES}" ]; then
          while IFS= read -r line; do
            [ -n "${line}" ] && ARGS+=(--values "${line}")
          done <<< "${VALUES}"
        fi
        if [ -n "${SET}" ]; then
          while IFS= read -r line; do
            [ -n "${line}" ] && ARGS+=(--set "${line}")
          done <<< "${SET}"
        fi
        pacto validate "${CONTRACT_PATH}" ${ARGS[@]+"${ARGS[@]}"}

    # ── Diff ───────────────────────────────────────────────
    - name: Validate diff inputs
      if: inputs.command == 'diff'
      shell: bash
      env:
        OLD_REF: ${{ inputs.old }}
        NEW_REF: ${{ inputs.new }}
      run: |
        if [ -z "${OLD_REF}" ] || [ -z "${NEW_REF}" ]; then
          echo "::error::Both 'old' and 'new' inputs are required for the diff command"
          exit 1
        fi

    - name: Run pacto diff
      if: inputs.command == 'diff'
      id: diff
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        OLD_REF: ${{ inputs.old }}
        NEW_REF: ${{ inputs.new }}
        OUTPUT_FORMAT: ${{ inputs.output-format }}
        FAIL_ON_BREAKING: ${{ inputs.fail-on-breaking }}
        PACTO_NO_CACHE: ${{ inputs.cache == 'true' && '0' || '1' }}
        VALUES: ${{ inputs.values }}
        SET: ${{ inputs.set }}
        OLD_VALUES: ${{ inputs.old-values }}
        OLD_SET: ${{ inputs.old-set }}
        NEW_VALUES: ${{ inputs.new-values }}
        NEW_SET: ${{ inputs.new-set }}
      run: |
        ARGS=()
        # Common overrides (applied to both sides)
        if [ -n "${VALUES}" ]; then
          while IFS= read -r line; do
            [ -n "${line}" ] && ARGS+=(--values "${line}")
          done <<< "${VALUES}"
        fi
        if [ -n "${SET}" ]; then
          while IFS= read -r line; do
            [ -n "${line}" ] && ARGS+=(--set "${line}")
          done <<< "${SET}"
        fi
        # Old-specific overrides
        if [ -n "${OLD_VALUES}" ]; then
          while IFS= read -r line; do
            [ -n "${line}" ] && ARGS+=(--old-values "${line}")
          done <<< "${OLD_VALUES}"
        fi
        if [ -n "${OLD_SET}" ]; then
          while IFS= read -r line; do
            [ -n "${line}" ] && ARGS+=(--old-set "${line}")
          done <<< "${OLD_SET}"
        fi
        # New-specific overrides
        if [ -n "${NEW_VALUES}" ]; then
          while IFS= read -r line; do
            [ -n "${line}" ] && ARGS+=(--new-values "${line}")
          done <<< "${NEW_VALUES}"
        fi
        if [ -n "${NEW_SET}" ]; then
          while IFS= read -r line; do
            [ -n "${line}" ] && ARGS+=(--new-set "${line}")
          done <<< "${NEW_SET}"
        fi

        set +e
        OUTPUT=$(pacto diff "${OLD_REF}" "${NEW_REF}" --output-format "${OUTPUT_FORMAT}" ${ARGS[@]+"${ARGS[@]}"} 2>&1)
        EXIT_CODE=$?
        set -e

        # Set outputs using heredoc delimiter for multiline safety
        {
          echo "diff-output<<PACTO_DIFF_EOF"
          echo "${OUTPUT}"
          echo "PACTO_DIFF_EOF"
        } >> "${GITHUB_OUTPUT}"

        # Write to step summary
        {
          echo "## Pacto Diff Results"
          echo ""
          if [ "${OUTPUT_FORMAT}" = "markdown" ]; then
            echo "${OUTPUT}"
          else
            echo '```'
            echo "${OUTPUT}"
            echo '```'
          fi
        } >> "${GITHUB_STEP_SUMMARY}"

        echo "${OUTPUT}"

        if [ ${EXIT_CODE} -ne 0 ]; then
          echo "has-breaking-changes=true" >> "${GITHUB_OUTPUT}"
          if [ "${FAIL_ON_BREAKING}" = "true" ]; then
            echo "::error::Breaking changes detected between contracts"
            exit 1
          fi
          echo "::warning::Breaking changes detected between contracts"
        else
          echo "has-breaking-changes=false" >> "${GITHUB_OUTPUT}"
        fi

    - name: Comment diff on PR
      if: always() && inputs.command == 'diff' && inputs.comment-on-pr == 'true' && steps.diff.outcome != 'skipped'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        EVENT_NAME: ${{ github.event_name }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
        DIFF_OUTPUT: ${{ steps.diff.outputs.diff-output }}
        HAS_BREAKING: ${{ steps.diff.outputs.has-breaking-changes }}
        NEW_REF: ${{ inputs.new }}
        OUTPUT_FORMAT: ${{ inputs.output-format }}
      run: |
        set -euo pipefail

        # Determine PR number
        if [ "${EVENT_NAME}" = "pull_request" ] || [ "${EVENT_NAME}" = "pull_request_target" ]; then
          RESOLVED_PR="${PR_NUMBER}"
        else
          echo "::warning::comment-on-pr is enabled but this is not a pull request event (event: ${EVENT_NAME}). Skipping comment."
          exit 0
        fi

        if [ -z "${RESOLVED_PR}" ]; then
          echo "::warning::Could not determine pull request number. Skipping comment."
          exit 0
        fi

        MARKER="<!-- pacto-diff-comment:${NEW_REF} -->"

        # Wrap markdown tables larger than the threshold in <details> for collapsibility
        collapse_large_tables() {
          awk -v threshold=15 '
            BEGIN { in_table = 0; in_code = 0; row_count = 0 }
            /^```/ {
              if (in_table) { flush_table(); in_table = 0; row_count = 0 }
              in_code = !in_code; print; next
            }
            in_code { print; next }
            /^[[:space:]]*\|/ {
              if (!in_table) { in_table = 1; row_count = 0 }
              row_count++
              table_lines[row_count] = $0
              next
            }
            {
              if (in_table) { flush_table(); in_table = 0; row_count = 0 }
              print
            }
            END { if (in_table) flush_table() }
            function flush_table(   i, data_rows) {
              data_rows = row_count - 2
              if (data_rows < 0) data_rows = row_count
              if (row_count > threshold) {
                print "<details>"
                print "<summary>Table (" data_rows " rows) — click to expand</summary>"
                print ""
                for (i = 1; i <= row_count; i++) print table_lines[i]
                print ""
                print "</details>"
              } else {
                for (i = 1; i <= row_count; i++) print table_lines[i]
              }
            }
          '
        }

        # Write body to temp file for safe multiline handling
        BODY_FILE=$(mktemp)
        {
          echo "${MARKER}"
          if [ "${HAS_BREAKING}" = "true" ]; then
            echo "## ⚠️ Pacto Diff — Breaking Changes Detected"
          else
            echo "## ✅ Pacto Diff — No Breaking Changes"
          fi
          echo ""
          if [ "${OUTPUT_FORMAT}" = "markdown" ]; then
            echo "${DIFF_OUTPUT}" | collapse_large_tables
          else
            echo '```'
            echo "${DIFF_OUTPUT}"
            echo '```'
          fi
        } > "${BODY_FILE}"

        # Search for existing comment with marker
        EXISTING_COMMENT_ID=$(gh api \
          --paginate \
          "repos/${REPO}/issues/${RESOLVED_PR}/comments" \
          --jq ".[] | select(.body | contains(\"${MARKER}\")) | .id" \
          | head -1)

        if [ -n "${EXISTING_COMMENT_ID}" ]; then
          # Update existing comment
          gh api \
            --method PATCH \
            "repos/${REPO}/issues/comments/${EXISTING_COMMENT_ID}" \
            -F body=@"${BODY_FILE}"
          echo "Updated existing PR comment (id: ${EXISTING_COMMENT_ID})"
        else
          # Create new comment
          gh api \
            --method POST \
            "repos/${REPO}/issues/${RESOLVED_PR}/comments" \
            -F body=@"${BODY_FILE}"
          echo "Created new PR comment"
        fi

        rm -f "${BODY_FILE}"

    # ── Doc ────────────────────────────────────────────────
    - name: Generate documentation
      if: inputs.command == 'doc'
      id: doc
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        CONTRACT_PATH: ${{ inputs.path }}
        OUTPUT_PATH: ${{ inputs.output-path }}
        ADD_TO_SUMMARY: ${{ inputs.add-to-summary }}
        PACTO_NO_CACHE: ${{ inputs.cache == 'true' && '0' || '1' }}
        VALUES: ${{ inputs.values }}
        SET: ${{ inputs.set }}
      run: |
        set -euo pipefail

        ARGS=()
        if [ -n "${VALUES}" ]; then
          while IFS= read -r line; do
            [ -n "${line}" ] && ARGS+=(--values "${line}")
          done <<< "${VALUES}"
        fi
        if [ -n "${SET}" ]; then
          while IFS= read -r line; do
            [ -n "${line}" ] && ARGS+=(--set "${line}")
          done <<< "${SET}"
        fi

        OUTPUT=$(pacto doc "${CONTRACT_PATH}" ${ARGS[@]+"${ARGS[@]}"})

        # Set output using heredoc delimiter for multiline safety
        {
          echo "doc-output<<PACTO_DOC_EOF"
          echo "${OUTPUT}"
          echo "PACTO_DOC_EOF"
        } >> "${GITHUB_OUTPUT}"

        # Write to file if output-path is set
        if [ -n "${OUTPUT_PATH}" ]; then
          mkdir -p "$(dirname "${OUTPUT_PATH}")"
          echo "${OUTPUT}" > "${OUTPUT_PATH}"
          echo "Documentation written to ${OUTPUT_PATH}"
        fi

        # Write to step summary if enabled
        if [ "${ADD_TO_SUMMARY}" = "true" ]; then
          echo "${OUTPUT}" >> "${GITHUB_STEP_SUMMARY}"
        fi

        echo "${OUTPUT}"

    - name: Comment documentation on PR
      if: inputs.command == 'doc' && inputs.comment-on-pr == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        EVENT_NAME: ${{ github.event_name }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
        DOC_OUTPUT: ${{ steps.doc.outputs.doc-output }}
        CONTRACT_PATH: ${{ inputs.path }}
      run: |
        set -euo pipefail

        # Determine PR number
        if [ "${EVENT_NAME}" = "pull_request" ] || [ "${EVENT_NAME}" = "pull_request_target" ]; then
          RESOLVED_PR="${PR_NUMBER}"
        else
          echo "::warning::comment-on-pr is enabled but this is not a pull request event (event: ${EVENT_NAME}). Skipping comment."
          exit 0
        fi

        if [ -z "${RESOLVED_PR}" ]; then
          echo "::warning::Could not determine pull request number. Skipping comment."
          exit 0
        fi

        MARKER="<!-- pacto-doc-comment:${CONTRACT_PATH} -->"

        # Wrap markdown tables larger than the threshold in <details> for collapsibility
        collapse_large_tables() {
          awk -v threshold=15 '
            BEGIN { in_table = 0; in_code = 0; row_count = 0 }
            /^```/ {
              if (in_table) { flush_table(); in_table = 0; row_count = 0 }
              in_code = !in_code; print; next
            }
            in_code { print; next }
            /^[[:space:]]*\|/ {
              if (!in_table) { in_table = 1; row_count = 0 }
              row_count++
              table_lines[row_count] = $0
              next
            }
            {
              if (in_table) { flush_table(); in_table = 0; row_count = 0 }
              print
            }
            END { if (in_table) flush_table() }
            function flush_table(   i, data_rows) {
              data_rows = row_count - 2
              if (data_rows < 0) data_rows = row_count
              if (row_count > threshold) {
                print "<details>"
                print "<summary>Table (" data_rows " rows) — click to expand</summary>"
                print ""
                for (i = 1; i <= row_count; i++) print table_lines[i]
                print ""
                print "</details>"
              } else {
                for (i = 1; i <= row_count; i++) print table_lines[i]
              }
            }
          '
        }

        # Write body to temp file for safe multiline handling
        BODY_FILE=$(mktemp)
        {
          echo "${MARKER}"
          echo "## Pacto Contract Documentation"
          echo ""
          echo "${DOC_OUTPUT}" | collapse_large_tables
        } > "${BODY_FILE}"

        # Search for existing comment with marker
        EXISTING_COMMENT_ID=$(gh api \
          --paginate \
          "repos/${REPO}/issues/${RESOLVED_PR}/comments" \
          --jq ".[] | select(.body | contains(\"${MARKER}\")) | .id" \
          | head -1)

        if [ -n "${EXISTING_COMMENT_ID}" ]; then
          # Update existing comment
          gh api \
            --method PATCH \
            "repos/${REPO}/issues/comments/${EXISTING_COMMENT_ID}" \
            -F body=@"${BODY_FILE}"
          echo "Updated existing PR comment (id: ${EXISTING_COMMENT_ID})"
        else
          # Create new comment
          gh api \
            --method POST \
            "repos/${REPO}/issues/${RESOLVED_PR}/comments" \
            -F body=@"${BODY_FILE}"
          echo "Created new PR comment"
        fi

        rm -f "${BODY_FILE}"
