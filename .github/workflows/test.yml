name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  # The TrianaLab/pacto commit the reusable workflow is tested with: main
  # after wave 3 of #452, the first commit with pacto ci and pacto ci --publish.
  PACTO_TEST_REF: bd0bdc42c6ac71ba7b8f4d0928f4ca933ce788a3

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run actionlint
        uses: reviewdog/action-actionlint@ae857e78c1b42b3d0a49637181b09d3d56d402b4 # v1.84.1
        with:
          fail_level: error

  smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Install pacto directly instead of using the action's `setup` command:
      # the upstream install script makes unauthenticated api.github.com calls
      # that get rate-limited on shared macOS runner IPs. We resolve "latest"
      # ourselves with an authenticated request (5000/h token limit) so the
      # smoke test always runs against the newest pacto release.
      - name: Install pacto (latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag=$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/TrianaLab/pacto/releases/latest \
            | grep -E '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$tag" ]; then
            echo "::error::Could not resolve latest pacto release"
            exit 1
          fi
          case "$(uname -m)" in
            x86_64|amd64) arch=amd64 ;;
            aarch64|arm64) arch=arm64 ;;
            *) echo "unsupported arch: $(uname -m)" >&2; exit 1 ;;
          esac
          os="$(uname | tr '[:upper:]' '[:lower:]')"
          url="https://github.com/TrianaLab/pacto/releases/download/${tag}/pacto_${os}_${arch}"
          echo "Installing pacto ${tag} from ${url}"
          curl -fsSL -o /tmp/pacto "$url"
          chmod +x /tmp/pacto
          sudo mv /tmp/pacto /usr/local/bin/pacto
          pacto version

      - name: Create fixture contract
        run: |
          mkdir -p contract
          cat > contract/pacto.yaml <<'EOF'
          pactoVersion: "2.0"
          service:
            name: smoke-test
            version: 1.0.0
          EOF

      - name: Validate contract
        uses: ./
        with:
          command: validate
          path: contract

      - name: Generate doc
        uses: ./
        with:
          command: doc
          path: contract
          add-to-summary: 'false'

      - name: Diff contract against itself
        id: diff
        uses: ./
        with:
          command: diff
          old: contract
          new: contract
          fail-on-breaking: 'true'

      - name: Verify no breaking changes detected
        run: |
          if [ "${{ steps.diff.outputs.has-breaking-changes }}" != "false" ]; then
            echo "::error::Expected has-breaking-changes=false, got '${{ steps.diff.outputs.has-breaking-changes }}'"
            exit 1
          fi

  pins:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every uses is pinned by SHA and pacto by version and sha256
        run: test/check-pins.sh

  permissions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Only publish holds the OIDC token and only comment writes to pull requests
        run: test/check-permissions.sh

  annotations:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The annotate step escapes a hostile plan and the lookup ignores foreign markers
        run: test/check-annotations.sh

  build-pacto:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Build pacto at PACTO_TEST_REF
        run: |
          CGO_ENABLED=0 GOBIN="$RUNNER_TEMP/bin" go install "github.com/trianalab/pacto/v4/cmd/pacto@${PACTO_TEST_REF}"
          "$RUNNER_TEMP/bin/pacto" ci --help > /dev/null
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pacto-bin
          path: ${{ runner.temp }}/bin/pacto
          retention-days: 1

  # Calls the reusable workflow the way a caller does: the caller grants the
  # union of its jobs' permissions, or GitHub refuses to start it.
  reusable:
    if: github.event_name == 'pull_request'
    needs: build-pacto
    permissions:
      contents: read
      packages: write
      id-token: write
      pull-requests: write
    uses: ./.github/workflows/ci.yml
    with:
      path: test/fixtures/monorepo
      pacto-artifact: pacto-bin
      publish: false

  reusable-check:
    if: github.event_name == 'pull_request'
    needs: [reusable, build-pacto]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: The reusable workflow reports pacto ci's exit code
        env:
          CODE: ${{ needs.reusable.outputs.exit-code }}
          GATE: ${{ needs.reusable.outputs.gate }}
        run: |
          if [ "$CODE" != 2 ] || [ "$GATE" != unverified ]; then
            echo "::error::exit-code=$CODE gate=$GATE, want 2 and unverified"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pacto-bin
          path: ${{ runner.temp }}/pacto-bin
      - name: The annotate step names each service of a real plan on its pacto.yaml
        run: |
          chmod +x "$RUNNER_TEMP/pacto-bin/pacto"
          export PATH="$RUNNER_TEMP/pacto-bin:$PATH"
          test/check-real-annotations.sh
